<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    
    .max-box { fill: #161b22; stroke: #a3b8cc; stroke-width: 1.5; stroke-linejoin: round; }
    .max-port { fill: #a3b8cc; }
    .max-fill { fill: #a3b8cc; }
    .max-cable { stroke: #667c93; stroke-width: 1.5; fill: none; stroke-linecap: round; }
    .max-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 8.5px; text-anchor: middle; dominant-baseline: middle; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .max-box { fill: #f6f8fa; stroke: #4a5c6d; }
      .max-port { fill: #4a5c6d; }
      .max-fill { fill: #4a5c6d; }
      .max-cable { stroke: #8ba2b8; }
      .max-text { fill: #1f2328; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- Max 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 1. Bang -> [ max ] 패치 케이블 -->
    <path class="max-cable" d="M 16 11.5 C 16 14.5, 9 14.5, 9 17.5" />

    <!-- 2. 상단 Bang 버튼 -->
    <rect class="max-box" x="11.5" y="2" width="9" height="9" rx="1.5" />
    <circle class="max-fill" cx="16" cy="6.5" r="2.8" />
    <rect class="max-port" x="15" y="11" width="2" height="1.5" />

    <!-- 3. 중앙 [ max ] 오브젝트 박스 -->
    <rect class="max-box" x="3" y="18" width="26" height="10" rx="1.5" />
    <!-- Inlets & Outlets -->
    <rect class="max-port" x="8" y="17" width="2" height="1.5" />
    <rect class="max-port" x="22" y="17" width="2" height="1.5" />
    <rect class="max-port" x="8" y="28" width="2" height="1.5" />
    
    <!-- 오브젝트 텍스트 "max" -->
    <text class="max-text" x="16" y="23.5">max</text>
  </g>
</svg>
