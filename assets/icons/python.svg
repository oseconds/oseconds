<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    /* 파이썬 공식 심볼 컬러 */
    .py-blue { fill: #3776ab; }
    .py-yellow { fill: #ffd43b; }
    .py-eye { fill: #ffffff; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- 파이썬 로고 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 상단 블루 뱀 -->
    <path class="py-blue" d="M 15.9,1 C 8.6,1 8.9,4.2 8.9,4.2 L 8.9,7.4 L 16.3,7.4 L 16.3,8.5 L 5.8,8.5 C 5.8,8.5 1.5,8 1.5,15.3 C 1.5,22.6 5.2,22.2 5.2,22.2 L 7.5,22.2 L 7.5,18.7 C 7.5,18.7 7.3,14.3 11.7,14.3 L 19,14.3 C 19,14.3 23.2,14.4 23.2,10.2 L 23.2,4.8 C 23.2,4.8 23.7,1 15.9,1 Z" />
    <circle class="py-eye" cx="11.8" cy="4.5" r="1.3" />

    <!-- 하단 옐로우 뱀 -->
    <path class="py-yellow" d="M 16.1,31 C 23.4,31 23.1,27.8 23.1,27.8 L 23.1,24.6 L 15.7,24.6 L 15.7,23.5 L 26.2,23.5 C 26.2,23.5 30.5,24 30.5,16.7 C 30.5,9.4 26.8,9.8 26.8,9.8 L 24.5,9.8 L 24.5,13.3 C 24.5,13.3 24.7,17.7 20.3,17.7 L 13,17.7 C 13,17.7 8.8,17.6 8.8,21.8 L 8.8,27.2 C 8.8,27.2 8.3,31 16.1,31 Z" />
    <circle class="py-eye" cx="20.2" cy="27.5" r="1.3" />
  </g>
</svg>
