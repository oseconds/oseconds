<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    .ps-box { fill: #001e36; stroke: #31a8ff; stroke-width: 1.5; rx: 6px; }
    .ps-text { fill: #31a8ff; font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 14px; text-anchor: middle; dominant-baseline: middle; letter-spacing: -0.5px; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .ps-box { fill: #00101d; stroke: #2b95ef; }
      .ps-text { fill: #2b95ef; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- Adobe Ps 로고 박스 (포토샵 클래식 네이비 & 시안 블루) -->
  <rect class="ps-box" x="10" y="10" width="28" height="28" rx="6" />

  <!-- Ps 텍스트 -->
  <text class="ps-text" x="24" y="24.5">Ps</text>
</svg>
