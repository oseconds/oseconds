<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    
    /* OpenGL / GLSL 셰이더 컬러 파이프라인 */
    .gl-red-top { fill: #ff4d4d; }
    .gl-red-left { fill: #e52e28; }
    .gl-blue-light { fill: #00c2ff; }
    .gl-blue-mid { fill: #0072c6; }
    .gl-blue-dark { fill: #0d3c68; }
    .gl-blue-deep { fill: #1a5b98; }

    .gl-wire { stroke: #ffffff; stroke-width: 0.8; fill: none; opacity: 0.5; }
    .gl-node { fill: #ffffff; }
    .gl-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 800; font-size: 7.5px; letter-spacing: 0.6px; text-anchor: middle; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .gl-text { fill: #1f2328; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- GLSL 3D Shader Mesh (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 1. 프래그먼트 셰이더 삼각 메시 (Fragment Shader Facets) -->
    <!-- 상단 레드 파셋 (OpenGL Red Identity) -->
    <polygon class="gl-red-left" points="16,3 16,15 5,9" />
    <polygon class="gl-red-top" points="16,3 27,9 16,15" />
    <!-- 우측 사이안/블루 파셋 (Color Pipeline) -->
    <polygon class="gl-blue-light" points="16,15 27,9 27,21" />
    <polygon class="gl-blue-mid" points="16,15 27,21 16,25" />
    <!-- 좌측 딥 블루 파셋 (Shader Depth) -->
    <polygon class="gl-blue-dark" points="16,15 16,25 5,21" />
    <polygon class="gl-blue-deep" points="16,15 5,21 5,9" />

    <!-- 2. 버텍스 와이어프레임 (Vertex Shader Wireframe) -->
    <path class="gl-wire" d="M 16,3 L 27,9 L 27,21 L 16,25 L 5,21 L 5,9 Z M 16,15 L 16,3 M 16,15 L 27,9 M 16,15 L 27,21 M 16,15 L 16,25 M 16,15 L 5,21 M 16,15 L 5,9" />

    <!-- 3. 버텍스 노드 포인트 (Vertex Shader Points) -->
    <circle class="gl-node" cx="16" cy="3" r="1.1" />
    <circle class="gl-node" cx="27" cy="9" r="1.1" />
    <circle class="gl-node" cx="27" cy="21" r="1.1" />
    <circle class="gl-node" cx="16" cy="25" r="1.1" />
    <circle class="gl-node" cx="5" cy="21" r="1.1" />
    <circle class="gl-node" cx="5" cy="9" r="1.1" />
    <circle class="gl-node" cx="16" cy="15" r="1.4" />

    <!-- 4. 하단 GLSL 텍스트 -->
    <text class="gl-text" x="16" y="32">GLSL</text>
  </g>
</svg>
