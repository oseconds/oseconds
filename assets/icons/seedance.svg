<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    /* 다크 모드 (기본) - 무거운 딥 레드 테마 */
    .bg { fill: #161b22; rx: 10px; }
    .seed-box { fill: none; stroke: #7f1d1d; stroke-width: 2; rx: 4px; }
    .seed-wave { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .seed-dot { fill: #dc2626; }
    .seed-text {
      fill: #f87171;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 4.5px;
      letter-spacing: 0.5px;
      text-anchor: middle;
    }

    /* 라이트 모드 */
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .seed-box { stroke: #991b1b; }
      .seed-wave { stroke: #b91c1c; }
      .seed-dot { fill: #b91c1c; }
      .seed-text { fill: #7f1d1d; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- Seedance 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 1. 백그라운드 노드 박스 (기술적 뼈대) -->
    <rect class="seed-box" x="3" y="3" width="26" height="20" rx="4" />
    
    <!-- 2. 역동적인 웨이브 (Dance) & 3. 시드(Seed) 포인트 -->
    <path class="seed-wave" d="M 7 13 C 12 5, 20 21, 25 13" />
    <circle class="seed-dot" cx="16" cy="13" r="3" />

    <!-- Seedance 하단 텍스트 (SD 배제, 겹침 방지 완벽 여백) -->
    <text class="seed-text" x="16" y="30">SEEDANCE</text>
  </g>
</svg>
