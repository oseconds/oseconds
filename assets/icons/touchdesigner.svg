<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    /* 올리브/카키 톤 바탕 (공식 로고 컬러) */
    .td-base { fill: #6b7c52; }
    .td-stroke { stroke: #000000; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
    .td-fill-black { fill: #000000; }
    .td-fill-white { fill: #ffffff; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- TouchDesigner 공식 심볼 그룹 (내부 32x32) -->
  <g transform="translate(8, 8)">
    <!-- 1. 바탕 올리브 그린 정사각형 -->
    <rect class="td-base" x="0" y="0" width="32" height="32" />
    
    <!-- 외각 굵은 테두리 -->
    <rect fill="none" stroke="#000000" stroke-width="2.5" x="0" y="0" width="32" height="32" />

    <!-- 2. 십자 분할선 -->
    <line class="td-stroke" x1="16" y1="0" x2="16" y2="32" />
    <line class="td-stroke" x1="0" y1="16" x2="32" y2="16" />

    <!-- 3. 대각선 연결선 (중앙에서 4개 모서리 노드로) -->
    <line class="td-stroke" x1="16" y1="16" x2="6" y2="6" />
    <line class="td-stroke" x1="16" y1="16" x2="26" y2="6" />
    <line class="td-stroke" x1="16" y1="16" x2="6" y2="26" />
    <line class="td-stroke" x1="16" y1="16" x2="26" y2="26" />

    <!-- 4. 네 모서리의 검은 사각형 노드 -->
    <rect class="td-fill-black" x="3" y="3" width="6" height="6" />
    <rect class="td-fill-black" x="23" y="3" width="6" height="6" />
    <rect class="td-fill-black" x="3" y="23" width="6" height="6" />
    <rect class="td-fill-black" x="23" y="23" width="6" height="6" />

    <!-- 5. 중앙 흰색 원 & 검은 테두리 -->
    <circle cx="16" cy="16" r="7" class="td-fill-white" stroke="#000000" stroke-width="2" />

    <!-- 6. 중앙 최내각 검은 사각형 -->
    <rect class="td-fill-black" x="13.5" y="13.5" width="5" height="5" />
  </g>
</svg>
