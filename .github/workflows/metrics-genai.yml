name: Metrics GenAI Workflows

on:
  schedule:
    - cron: "15 0 * * 3"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics-genai.yml"

jobs:
  genai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: GenAI Workflows
        uses: oseconds/metrics@master
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds

          base: ""
          filename: metrics-genai.svg

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines,percentage
          plugin_languages_limit: 8
          plugin_languages_other: no
          plugin_languages_threshold: "0%"

          # Prompt/workflow families are represented through .gitattributes aliases.
          plugin_languages_categories: programming,data
          plugin_languages_aliases: Thrift:MiniMax H3,INI:Seedance,Kotlin:Kling,Gherkin:GPT Image,Crystal:GPT Image,C:Seedream,Zig:Z-Image,Fantom:FLUX
          plugin_languages_ignored: JavaScript,Python,Svelte,TypeScript,TSX,CSS,Batchfile,PowerShell,JSON,TSV,YAML,CSV,TOML,Dotenv,Ignore List,Pip Requirements,Vue
          plugin_languages_colors: "minimax h3:#84cc16,seedance:#ef4444,kling:#700bf5,gpt image:#a855f7,z-image:#3b82f6,flux:#f59e0b,seedream:#22c55e"

          plugin_languages_skipped: metrics
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
