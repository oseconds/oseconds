name: Metrics Languages Indepth

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Languages Indepth
        uses: oseconds/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: oseconds

          use_prebuilt_image: yes

          filename: metrics-languages-indepth.svg

          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used

          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 0
          plugin_languages_other: no
          plugin_languages_ignored: svg
          plugin_languages_aliases: Thrift:MinMaxH3,INI:Seedance 


          plugin_languages_categories: programming,markup,data,prose

          plugin_languages_colors: Markdown:#1e293b, Seedance:#ef4444, MinMaxH3:#84cc16
          
          plugin_languages_analysis_timeout: 2400
          plugin_languages_analysis_timeout_repositories: 600

