name: Metrics Languages Indepth

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Languages Indepth
        uses: oseconds/metrics@7431ea099c3caa2fe7f2c848dac848c2965fae57
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: oseconds

          filename: metrics-languages-indepth.svg

          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 12
          plugin_languages_other: no
          plugin_languages_analysis_timeout: 1200
          plugin_languages_analysis_timeout_repositories: 600

