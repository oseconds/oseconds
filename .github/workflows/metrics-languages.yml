name: Metrics Languages Indepth

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Languages Indepth
        uses: oseconds/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: oseconds

          use_prebuilt_image: yes

          filename: metrics-languages-indepth.svg

          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used

          plugin_languages_colors: markdown:#1e293b,seedance:#ef4444,minimaxh3:#84cc16

          plugin_languages_details: lines,percentage
          plugin_languages_limit: 0
          plugin_languages_other: no
          plugin_languages_ignored: svg
          plugin_languages_aliases: Thrift:MiniMaxH3,INI:Seedance 


          plugin_languages_categories: programming,markup,data,prose
          plugin_languages_threshold: 0.3
          
          
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15

