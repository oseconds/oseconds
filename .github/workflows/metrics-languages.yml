name: Metrics Languages

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics-languages.yml"

jobs:
  languages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Languages
        uses: oseconds/metrics@master
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds

          base: ""
          filename: metrics-languages-indepth.svg

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines,percentage
          plugin_languages_limit: 8
          plugin_languages_other: no
          plugin_languages_threshold: "0%"

          # Actual development languages only.
          plugin_languages_categories: programming,markup
          plugin_languages_aliases: Thrift:MiniMaxH3,INI:Seedance,Kotlin:Kling,Gherkin:GPTImage,Crystal:GPTImage,C:Seedream,Zig:ZImage,Fantom:FLUX,TSX:TypeScript
          plugin_languages_ignored: Markdown,AsciiDoc,Mermaid,Batchfile,PowerShell,MiniMaxH3,Seedance,Kling,GPTImage,ZImage,FLUX,Seedream

          plugin_languages_skipped: metrics
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
