name: Metrics Languages Recent

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Languages Recent
        uses: oseconds/metrics@master
        with:
          user: oseconds
          token: ${{ secrets.METRICS_TOKEN }}

          # Local patched version
          use_prebuilt_image: no

          # Debug
          debug: yes
          debug_print: yes

          filename: metrics-languages-recent.svg

          template: classic
          base: ""

          # Languages
          plugin_languages: yes
          plugin_languages_indepth: yes

          plugin_languages_sections: recently-used

          plugin_languages_limit: 12
          plugin_languages_details: lines,bytes-size,percentage

          # Recent languages
          plugin_languages_recent_categories: data,markup,programming,prose
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30

          # Analysis
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15