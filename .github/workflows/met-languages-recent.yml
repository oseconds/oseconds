name: Metrics Languages Recent

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Languages Recent
        uses: oseconds/metrics@master
        with:
          user: oseconds
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: yes
          
          filename: metrics-languages-recent.svg

          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: recently-used

          plugin_languages_limit: 8
          plugin_languages_details: lines,percentage

          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30

          plugin_languages_recent_categories: programming,markup,data
