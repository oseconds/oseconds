name: MetricsFull

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Metrics
      uses: oseconds/metrics@master
      with:
        use_prebuilt_image: false
        debug: yes
        debug_print: yes
        token: ${{ secrets.METRICS_TOKEN }}
        user: oseconds
    
        template: classic
        filename: profile/metrics_Full.svg
    
        ####################################################
        ## Base
        ####################################################
        base: header,activity,community,repositories
    
        config_timezone: Asia/Seoul
    
        ####################################################
        ## Languages
        ####################################################
        plugin_languages: yes
        plugin_languages_limit: 8
        plugin_languages_sections: most-used,recently-used
        plugin_languages_indepth: yes
        plugin_languages_analysis_timeout: 600
        plugin_languages_analysis_timeout_repositories: 180
        plugin_languages_recent_days: 30
        plugin_languages_recent_load: 1000
        plugin_languages_recent_categories: programming,data,markup,prose
        plugin_languages_categories: programming,data,markup,prose
        plugin_languages_colors: github
        plugin_languages_details: lines,percentage
    
        ####################################################
        ## Code
        ####################################################
        plugin_code: yes
        plugin_code_lines: 12
        plugin_code_load: 1000
        plugin_code_days: 30
        plugin_code_languages: ""
        plugin_code_visibility: all
    
        ####################################################
        ## Topics
        ####################################################
        plugin_topics: yes
        plugin_topics_mode: labels
        plugin_topics_limit: 20
    
        ####################################################
        ## Habits
        ####################################################
        plugin_habits: yes
        plugin_habits_days: 30
        plugin_habits_facts: yes
        plugin_habits_charts: yes
        plugin_habits_from: 200
    
        ####################################################
        ## Isocalendar
        ####################################################
        plugin_isocalendar: yes
    
        ####################################################
        ## Achievements
        ####################################################
        plugin_achievements: yes
        plugin_achievements_threshold: C
        plugin_achievements_secrets: yes
        plugin_achievements_display: compact
    

        ####################################################
        ## WakaTime
        ####################################################
        plugin_wakatime: yes
        plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
        plugin_wakatime_sections: time,languages
