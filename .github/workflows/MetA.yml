name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Metrics
        uses: oseconds/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds

          template: classic
          filename: profile/metrics.svg

          base: header,activity
          config_timezone: Asia/Seoul

          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 12

          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 1000
          plugin_code_days: 30
          plugin_code_languages: javascript,typescript,python
          plugin_code_visibility: all

          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_sections: time,languages
