name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Activity
        uses: oseconds/metrics@master
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds
    
          template: classic
          base: header,activity
          filename: profile/activity.svg
    
          config_timezone: Asia/Seoul
    
    
      - name: Topics
        uses: oseconds/metrics@master
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds
    
          template: classic
          base: ""
          filename: profile/topics.svg
    
          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 15
    
    
      - name: Code
        uses: oseconds/metrics@master
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds

          template: classic
          base: ""
          filename: profile/code.svg

          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 1000
          plugin_code_days: 30
          plugin_code_languages: javascript,typescript,python

          plugin_code_visibility: all
    
    
      - name: WakaTime
        uses: oseconds/metrics@master
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds
    
          template: classic
          base: ""
          filename: profile/mt-wakatime.svg
    
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_sections: time,languages
