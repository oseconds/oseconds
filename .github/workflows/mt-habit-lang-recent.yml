name: Metrics Habits

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Coding Habits + Recent Languages
        uses: oseconds/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: oseconds
          use_prebuilt_image: yes

          template: classic
          base: ""
          filename: profile/habits-lang.svg

          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 28
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: recently-used
          plugin_languages_limit: 8
          plugin_languages_details: lines,percentage

          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30
          plugin_languages_recent_categories: programming,markup,data

          plugin_languages_analysis_timeout: 2400
          plugin_languages_analysis_timeout_repositories: 600
