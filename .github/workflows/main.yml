name: Waka Readme

on:
  schedule:
    # Runs at 12am IST
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          SECTION_NAME: "activity"

          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LANGUAGE: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"

          SHOW_COMMIT: "True"

          SHOW_LOC_CHART: "True"
          SHOW_DAYS_OF_WEEK: "False"

          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"

          SHOW_LANGUAGE_PER_REPO: "False"

          SHOW_OS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"

          SHOW_UPDATED_DATE: "True"

          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "Update Activity Overview"

          LOCALE: "us"
          UPDATED_DATE_FORMAT: "%Y-%m-%d"

          

          SYMBOL_VERSION: "2"
          BADGE_STYLE: "flat"
          DEBUG_LOGGING: "False"
  
