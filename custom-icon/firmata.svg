<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 배경 카드 -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#161b22" />

  <!-- Firmata 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 1. 하드웨어 IC 핀 -->
    <rect x="2" y="7" width="3" height="1.8" rx="0.5" fill="#94a3b8" />
    <rect x="2" y="15" width="3" height="1.8" rx="0.5" fill="#94a3b8" />
    <rect x="27" y="7" width="3" height="1.8" rx="0.5" fill="#94a3b8" />
    <rect x="27" y="15" width="3" height="1.8" rx="0.5" fill="#94a3b8" />

    <!-- 2. 연결 라인 -->
    <path d="M 5 12 H 10 M 22 12 H 27" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3. 데이터 파형 브리지 -->
    <path d="M 10 12 C 10 6 14 6 16 12 C 18 18 22 18 22 12" stroke="#38bdf8" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4. 통신 데이터 노드 -->
    <circle cx="16" cy="12" r="1.8" fill="#38bdf8" />
    <circle cx="10" cy="12" r="1.3" fill="#38bdf8" />
    <circle cx="22" cy="12" r="1.3" fill="#38bdf8" />

    <!-- 5. FIRMATA 텍스트 -->
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5.5" letter-spacing="1" text-anchor="middle">FIRMATA</text>
  </g>
</svg>
