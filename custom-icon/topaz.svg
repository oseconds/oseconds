<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    .box { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .box { fill: #24292f; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- 2D 정사각형 3개 (모서리가 맞닿는 대각선 계단 구조, 라운딩 없음, 순백색) -->
  <rect class="box" x="29" y="9" width="10" height="10" />
  <rect class="box" x="19" y="19" width="10" height="10" />
  <rect class="box" x="9" y="29" width="10" height="10" />
</svg>
