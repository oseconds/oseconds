<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; }
    .sd-letter { stroke: #ffffff; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .sd-accent { fill: #818cf8; }
    .sd-subtext { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 3.6px; letter-spacing: 0.8px; text-anchor: middle; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .sd-letter { stroke: #0f172a; }
      .sd-accent { fill: #4f46e5; }
      .sd-subtext { fill: #64748b; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- SD 모노그램 심볼 -->
  <g transform="translate(8, 8)">
    <path class="sd-letter" d="M 13.5 6 H 8.5 C 6.5 6 5 7.5 5 9.5 C 5 11.5 6.5 13 8.5 13 H 10.5 C 12.5 13 14 14.5 14 16.5 C 14 18.5 12.5 20 10.5 20 H 5.5" />
    <path class="sd-letter" d="M 18 6 V 20 M 18 6 H 21.5 C 25.5 6 27.5 8.5 27.5 13 C 27.5 17.5 25.5 20 21.5 20 H 18" />
    <path class="sd-accent" d="M 28.5 1 C 28.5 3.5 30.5 3.5 30.5 3.5 C 30.5 3.5 28.5 3.5 28.5 6 C 28.5 3.5 26.5 3.5 26.5 3.5 C 26.5 3.5 28.5 3.5 28.5 1 Z" />
    <text class="sd-subtext" x="16" y="27">STABLE</text>
    <text class="sd-subtext" x="16" y="31">DIFFUSION</text>
  </g>
</svg>
