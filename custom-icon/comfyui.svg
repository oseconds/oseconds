<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    
    .comfy-box { fill: #f2ff59; rx: 6px; }
    .comfy-text { fill: #211927; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .comfy-box { fill: #211927; rx: 6px; }
      .comfy-text { fill: #f2ff59; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- ComfyUI 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 중앙 로고 박스 (다크: Comfy Yellow, 라이트: Comfy Ink) -->
    <rect class="comfy-box" x="2" y="2" width="28" height="28" rx="6" />
    
    <!-- 'C' 텍스트 -->
    <text class="comfy-text" x="16" y="17.5">C</text>
  </g>
</svg>
