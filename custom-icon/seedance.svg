<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 씨앗 껍질을 위한 고급스러운 모던 웜 브라운 그라데이션 -->
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a373; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8d5b4c; stop-opacity:1" />
    </linearGradient>

    <!-- 생명력 넘치는 테크-스프라우트 네온 에메랄드 그라데이션 -->
    <linearGradient id="sprout-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669; stop-opacity:1" />
    </linearGradient>

    <!-- 은은한 글로우 섀도우 효과 -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #0b0f17; rx: 12px; }
    
    /* 모던 원형 테두리 (Glow & Gradient) */
    .circle-shell {
      fill: none;
      stroke: url(#brown-grad);
      stroke-width: 3.2;
      stroke-linecap: round;
    }
    
    /* 입체감 있는 초록색 S-Sprout 패스 */
    .modern-s {
      fill: none;
      stroke: url(#sprout-grad);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#soft-glow);
    }
    
    /* S 상단의 정교한 모던 잎사귀 */
    .modern-leaf {
      fill: url(#sprout-grad);
      filter: url(#soft-glow);
    }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
    }
  </style>

  <!-- 카드 배경 -->
  <rect class="bg" width="48" height="48" rx="12" />

  <g transform="translate(0, 1)">
    <!-- 1. 그라데이션 원형 테두리 (Gradient Shell) -->
    <circle class="circle-shell" cx="24" cy="23.5" r="14" />

    <!-- 2. S 상단의 입체적인 모던 잎사귀 -->
    <path class="modern-leaf" d="M 27.5 15 C 31.5 13, 33 16, 30 18 C 28 19.2, 26.5 18, 27.5 15 Z" />

    <!-- 3. 테크 에메랄드 그라데이션 S-줄기 -->
    <path class="modern-s" d="M 27.5 17.5 
             C 21.5 17.5, 18 21.5, 23.5 25 
             C 29 28.5, 25 32.5, 18.5 32.5" />
  </g>
</svg>
