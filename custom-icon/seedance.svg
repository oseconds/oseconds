<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#8d5b4c" />
    </linearGradient>
    <linearGradient id="sprout-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0b0f17; rx: 12px; }
    .circle-shell { fill: none; stroke: url(#brown-grad); stroke-width: 3.2; stroke-linecap: round; }
    .sprout-stem { fill: none; stroke: url(#sprout-grad); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .sprout-leaf { fill: url(#sprout-grad); }
    .leaf-line { fill: none; stroke: #0b0f17; stroke-width: 1.2; stroke-linecap: round; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .leaf-line { stroke: #f8fafc; }
    }
  </style>

  <rect class="bg" width="48" height="48" rx="12" />

  <g transform="translate(0, 1)">
    <circle class="circle-shell" cx="24" cy="23.5" r="14" />

    <!-- 잎사귀 + 내부에 빠진 잎맥 선 -->
    <path class="sprout-leaf" d="M 27.5 13 C 32 11.5, 33.5 15, 29 17.5 C 27 18.6, 25.8 17.5, 27.5 13 Z" />
    <path class="leaf-line" d="M 27.5 16 C 29 15, 30 14" />

    <path class="sprout-stem" d="M 28 17 
             C 20.5 17, 17 21.5, 23.5 25.5 
             C 29.5 29.5, 25.5 34, 17 34" />
  </g>
</svg>
