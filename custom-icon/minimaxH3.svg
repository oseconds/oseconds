<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    /* 다크 모드 (기본) */
    .bg { fill: #000000; rx: 10px; }
    .capsule-dark { fill: none; stroke: #164e0e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .capsule-bright { fill: none; stroke: #ccff00; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

    /* 라이트 모드 (완전한 화이트/라이트 그레이 배경 및 가독성 최적화 컬러) */
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; rx: 10px; }
      .capsule-dark { stroke: #cbd5e1; }
      .capsule-bright { stroke: #15803d; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <g transform="translate(1, 0)">
    <!-- H 영역 -->
    <path class="capsule-dark" d="M 10 12 L 10 36" />
    <path class="capsule-bright" d="M 10 12 L 10 36" />

    <path class="capsule-dark" d="M 10 24 L 21 24" />
    <path class="capsule-bright" d="M 10 24 L 21 24" />

    <path class="capsule-dark" d="M 21 12 L 21 36" />
    <path class="capsule-bright" d="M 21 12 L 21 36" />

    <!-- 3 영역 -->
    <path class="capsule-dark" d="M 27 12 C 30 11, 37 11, 37 18 C 37 24, 30 23, 27 24" />
    <path class="capsule-bright" d="M 27 12 C 30 11, 37 11, 37 18 C 37 24, 30 23, 27 24" />

    <path class="capsule-dark" d="M 27 24 C 30 25, 38 25, 38 30 C 38 37, 30 37, 27 36" />
    <path class="capsule-bright" d="M 27 24 C 30 25, 38 25, 38 30 C 38 37, 30 37, 27 36" />
  </g>
</svg>
