<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    .kling-box { fill: #7c3aed; rx: 6px; }
    .kling-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: end; letter-spacing: -0.5px; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .kling-box { fill: #6d28d9; }
      .kling-text { fill: #ffffff; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- Kling 로고 박스 (#7C3AED) -->
  <rect class="kling-box" x="10" y="10" width="28" height="28" rx="6" />

  <!-- KL 텍스트 (우측 하단 배치) -->
  <text class="kling-text" x="35" y="34">KL</text>
</svg>
