<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    
    /* 대각선 대칭 브랜드 컬러 */
    .tc-diag-1 { stroke: #00e5ff; fill: none; stroke-linecap: round; }
    .tc-diag-2 { stroke: #ff007f; fill: none; stroke-linecap: round; }
    .tc-center { fill: #ffd43b; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .tc-diag-1 { stroke: #0095a8; }
      .tc-diag-2 { stroke: #d8006f; }
      .tc-center { fill: #e5a000; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- TidalCycles 4등분 원반 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 1. 대각선 대칭 세트 A (우상단 & 좌하단 - Cyan) -->
    <circle class="tc-diag-1" cx="16" cy="16" r="10" stroke-width="5" stroke-dasharray="8.5 22.9" transform="rotate(-83 16 16)" />

    <!-- 2. 대각선 대칭 세트 B (좌상단 & 우하단 - Pink) -->
    <circle class="tc-diag-2" cx="16" cy="16" r="10" stroke-width="5" stroke-dasharray="8.5 22.9" transform="rotate(7 16 16)" />

    <!-- 3. 원반 중심 노드 (Bright Yellow) -->
    <circle class="tc-center" cx="16" cy="16" r="2.8" />
  </g>
</svg>
