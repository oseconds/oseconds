<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 배경 카드 -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#161b22" />

  <!-- Resolume 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 1. 입체 큐브 패싯 (Resolume Official Red / Magenta Palette) -->
    <!-- 상단 면 (Neon Crimson / Hot Pink) -->
    <polygon points="16,3 27,9 16,15 5,9" fill="#ff2a6d" opacity="0.95" />
    
    <!-- 좌측 면 (Vibrant Red) -->
    <polygon points="5,9 16,15 16,24 5,18" fill="#e60039" opacity="0.85" />
    
    <!-- 우측 면 (Deep Magenta / Purple Indigo) -->
    <polygon points="16,15 27,9 27,18 16,24" fill="#990066" opacity="0.9" />

    <!-- 2. 에지 와이어프레임 -->
    <path d="M 16 3 L 27 9 L 27 18 L 16 24 L 5 18 L 5 9 Z M 16 15 L 16 3 M 16 15 L 27 9 M 16 15 L 5 9" 
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.6" />

    <!-- 3. RESOLUME 텍스트 -->
    <text x="16" y="30.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="4.2" letter-spacing="0.8" text-anchor="middle">RESOLUME</text>
  </g>
</svg>
