<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bg { fill: #161b22; rx: 10px; }
    /* 블렌더 공식 브랜드 컬러 */
    .bl-orange { fill: #ea7600; }
    .bl-blue { fill: #225789; }
    .bl-white { fill: #ffffff; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
    }
  </style>

  <!-- 배경 카드 -->
  <rect class="bg" width="48" height="48" rx="10" />

  <!-- 블렌더 로고 심볼 (내부 32x32 Safe Zone) -->
  <g transform="translate(8, 8)">
    <!-- 3방향 뻗은 오렌지 암 (120도 균등 대칭 배치) -->
    <rect x="13.1" y="4.5" width="5.8" height="14" rx="2.9" class="bl-orange" />
    <rect x="13.1" y="4.5" width="5.8" height="14" rx="2.9" class="bl-orange" transform="rotate(120, 16, 18.5)" />
    <rect x="13.1" y="4.5" width="5.8" height="14" rx="2.9" class="bl-orange" transform="rotate(-120, 16, 18.5)" />

    <!-- 중앙 오렌지 바디 -->
    <circle class="bl-orange" cx="16" cy="18.5" r="9" />

    <!-- 중앙 흰색 링 -->
    <circle class="bl-white" cx="16" cy="18.5" r="5.2" />

    <!-- 중앙 파란색 동공 -->
    <circle class="bl-blue" cx="16" cy="18.5" r="2.8" />
  </g>
</svg>
